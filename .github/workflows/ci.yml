name: CI

# Runs on every push and PR. Three jobs, ordered fast -> slow so a broken
# guardrail fails in seconds rather than waiting on the Postgres job:
#
#   1. test          - guardrail unit tests + lint. No DB, no API key, no
#                       Docker. This is the job branch-protection should
#                       require, since it's fast and 100% deterministic.
#   2. eval-smoke     - spins up real Postgres+pgvector, seeds a small
#                       dataset, runs the Phase 4 eval harness with
#                       LLM_PROVIDER=mock (no API key needed) as a
#                       structural smoke test: does the graph/guardrail/
#                       retrieval/DB-execution pipeline still run
#                       end-to-end. This is NOT an accuracy gate (mock's
#                       numbers aren't a real accuracy signal, see
#                       eval/REPORT.md) -- it just fails loudly if a code
#                       change breaks the pipeline's plumbing.
#   3. docker-build   - confirms the backend Dockerfile still builds.
#
# None of these need ANTHROPIC_API_KEY/OPENAI_API_KEY. If a
# CLAUDE_API_KEY / OPENAI_API_KEY repo secret is ever added, `eval-smoke`
# is the natural place to add a fourth, optional job that runs the real
# eval against a live model -- see PROGRESS.md Phase 5 "NEXT STEPS".

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  test:
    name: Guardrail unit tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check backend/ tests/ eval/ --output-format=github

      - name: Run guardrail unit tests
        run: pytest tests/ -v --tb=short

  eval-smoke:
    name: Eval harness smoke test (mock LLM, real Postgres)
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: querymind
          POSTGRES_PASSWORD: querymind
          POSTGRES_DB: querymind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U querymind -d querymind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://querymind:querymind@localhost:5432/querymind
      READONLY_DATABASE_URL: postgresql://querymind_readonly:querymind_readonly@localhost:5432/querymind
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: local
      TOP_K_CONTEXT: 5
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Enable pgvector extension
        run: psql "$DATABASE_URL" -f data/seed/init_extensions.sql

      - name: Generate + seed a small synthetic dataset
        # Small/fast scale, same as Phases 2-4's own dev-loop scale --
        # this job needs the pipeline to run correctly, not a specific
        # data volume.
        run: |
          python data/seed/generate_data.py --seed 42 --users 500 --merchants 50 --transactions 8000
          python data/seed/seed_db.py

      - name: Create the read-only execution role
        run: psql "$DATABASE_URL" -f data/seed/create_readonly_role.sql

      - name: Introspect schema -> docs, then embed into pgvector
        run: |
          python backend/app/ingestion/introspect_schema.py
          python backend/app/ingestion/embed_documents.py

      - name: Run the eval harness (mock LLM -- structural smoke test only)
        run: python eval/run_eval.py --label ci_smoke --verbose

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-smoke-results
          path: |
            eval/reports/ci_smoke*.json
            eval/logs/ci_smoke*.jsonl
          retention-days: 14

  docker-build:
    name: Docker build (backend)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t querymind-backend:ci .

      - name: Smoke-test the image starts and /health responds
        run: |
          docker run -d --name querymind-ci \
            -e LLM_PROVIDER=mock \
            -e DATABASE_URL=postgresql://noop:noop@localhost:5432/noop \
            -e READONLY_DATABASE_URL=postgresql://noop:noop@localhost:5432/noop \
            -p 8000:8000 querymind-backend:ci
          # /health doesn't touch the DB (see backend/app/api/main.py) so
          # this proves the container starts and serves traffic even
          # without a real database attached -- a DB-dependent endpoint
          # is exactly what eval-smoke already covers, against a real DB.
          for i in {1..10}; do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done
          curl -sf http://localhost:8000/health
          docker logs querymind-ci
          docker stop querymind-ci
